[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc-xs-helpers"
version = "0.1.0"
description = "Convenience helpers for inspecting and plotting OpenMC cross sections"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lindsay Downe"}]
dependencies = [
  "numpy",
  "plotly",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "nbconvert"]
dev = ["pytest", "ruff"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
